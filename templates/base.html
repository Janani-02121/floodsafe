<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FloodSafe{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('home') }}" class="nav-logo">🌊 FloodSafe</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('route_finder') }}">Route Finder</a>
            <a href="{{ url_for('admin_dashboard') }}">Admin</a>
        </div>
    </div>
</nav>

<main class="main-content">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>FloodSafe &mdash; Smart Flood Evacuation Route Finder | Built with Flask, Leaflet.js &amp; Dijkstra's Algorithm</p>
</footer>

{% block extra_scripts %}{% endblock %}
</body>
</html>
